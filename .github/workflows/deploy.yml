name: Deploy tradingWEB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  SERVER_HOST: "8.208.15.128"
  SERVER_USER: "root"
  SERVER_PATH: "/opt/tradingweb"

jobs:
  e2e-test:
    name: E2E Portal Stability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:3100"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  deploy:
    name: Build and Deploy
    needs: e2e-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync .next build
        run: >
          rsync -avz --delete
          -e "ssh -i ~/.ssh/deploy_key"
          .next/
          ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.SERVER_PATH }}/.next/

      - name: Sync config files
        run: >
          rsync -avz
          -e "ssh -i ~/.ssh/deploy_key"
          package.json pnpm-lock.yaml next.config.ts ecosystem.config.js public/
          ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.SERVER_PATH }}/

      - name: Install deps and restart
        run: >
          ssh -i ~/.ssh/deploy_key
          ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}
          "export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin;
          cd ${{ env.SERVER_PATH }};
          pnpm install --prod --frozen-lockfile;
          pm2 startOrReload ecosystem.config.js --update-env;
          pm2 save"

      - name: Health check
        run: |
          sleep 5
          curl -sSf -o /dev/null -w "%{http_code}" https://fjglobal.online || echo "Check warning"