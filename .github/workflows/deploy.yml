name: TradingWEB verification and deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  e2e-test:
    name: E2E Portal Stability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build Next.js application
        run: pnpm next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy (manual only)
    if: github.event_name == 'workflow_dispatch'
    needs: [e2e-test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SERVER_HOST: "${{ secrets.DEPLOY_HOST }}"
      SERVER_USER: "${{ secrets.DEPLOY_USER }}"
      SERVER_PATH: "${{ secrets.DEPLOY_PATH }}"
      DEPLOY_KEY: "${{ secrets.DEPLOY_KEY }}"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$SERVER_HOST" || { echo "DEPLOY_HOST is not configured"; exit 1; }
          test -n "$SERVER_USER" || { echo "DEPLOY_USER is not configured"; exit 1; }
          test -n "$SERVER_PATH" || { echo "DEPLOY_PATH is not configured"; exit 1; }
          test -n "$DEPLOY_KEY" || { echo "DEPLOY_KEY is not configured"; exit 1; }

      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Sync .next build
        run: >
          rsync -avz --delete
          -e "ssh -i ~/.ssh/deploy_key"
          .next/
          "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/.next/"

      - name: Sync config files
        run: >
          rsync -avz
          -e "ssh -i ~/.ssh/deploy_key"
          package.json pnpm-lock.yaml next.config.ts ecosystem.config.js public/
          "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/"

      - name: Install deps and restart
        run: >
          ssh -i ~/.ssh/deploy_key
          "${SERVER_USER}@${SERVER_HOST}"
          "export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin;
          cd ${SERVER_PATH};
          pnpm install --prod --frozen-lockfile;
          pm2 startOrReload ecosystem.config.js --update-env;
          pm2 save"

      - name: Health check
        run: |
          sleep 5
          curl -sSf -o /dev/null -w "%{http_code}" https://fjglobal.online
