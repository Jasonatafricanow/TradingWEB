name: TradingWEB quality gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tradingweb_ci_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: tradingweb_ci_test
      JWT_SECRET: ci-only-not-for-production-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm ts-check
      - run: pnpm lint:build
      - run: pnpm i18n:check
      - name: Replay migrations in disposable CI database
        run: pnpm exec drizzle-kit migrate
      - run: pnpm exec tsx scripts/schema-integrity-check.ts
      - run: pnpm exec tsx scripts/pos-integration-test.ts