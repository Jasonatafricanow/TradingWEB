# TradingWEB rate-limited locations (server context).
# Included from the site's server block by scripts/rate-limit-nginx.sh.
# Limits mirror RATE_LIMITS in src/lib/rate-limit.ts; the app keeps its own
# per-email limits, nginx stops floods before they reach Node.

# Payment provider callbacks arrive in bursts and are signature-checked;
# they must never be rate limited away.
location = /api/payment/webhook {
    include snippets/tradingweb-proxy.conf;
}
location = /api/payment/callback {
    include snippets/tradingweb-proxy.conf;
}

location ^~ /api/auth/ {
    limit_req zone=tw_auth burst=5 nodelay;
    include snippets/tradingweb-proxy.conf;
}

location = /api/payment/create {
    limit_req zone=tw_checkout burst=10 nodelay;
    include snippets/tradingweb-proxy.conf;
}
location = /api/orders {
    limit_req zone=tw_checkout burst=10 nodelay;
    include snippets/tradingweb-proxy.conf;
}

location ^~ /api/ {
    limit_req zone=tw_api burst=40 nodelay;
    include snippets/tradingweb-proxy.conf;
}
