# TradingWEB rate-limit zones (http context).
# Installed as /etc/nginx/conf.d/tradingweb-ratelimit.conf by
# scripts/rate-limit-nginx.sh. Keep every directive on its own line:
# the previous one-line sed put the zones inside a comment, so no limit
# was ever active.
#
# Behind a reverse proxy / CDN, $binary_remote_addr is the proxy's address
# and every visitor would share one bucket. The installer writes the real-ip
# lines below only when TRUSTED_PROXY_CIDRS is set.
# @REAL_IP@

limit_req_zone $binary_remote_addr zone=tw_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=tw_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tw_checkout:10m rate=20r/m;
limit_req_status 429;
